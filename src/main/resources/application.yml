spring:
  # 로컬에서는 프로젝트 루트의 .env 파일에서 DB 접속 정보와 API 키를 읽습니다 (Git에 올라가지 않음).
  # Render 같은 배포 환경에서는 대시보드의 Environment 변수로 같은 이름의 값을 넣으면 됩니다.
  config:
    import: optional:file:.env[.properties]

  # TiDB Cloud Serverless (MySQL 호환)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TiDB Cloud Serverless 는 한동안 안 쓰는 연결을 서버 쪽에서 끊습니다.
    # 그대로 두면 죽은 연결을 붙잡고 최대 30초를 기다리므로:
    #  - keepalive-time: 1분마다 놀고 있는 연결에 신호를 보내 끊기지 않게 함
    #  - max-lifetime: 5분이 지난 연결은 새 연결로 교체
    #  - connection-timeout: 연결을 못 얻으면 30초가 아니라 10초 안에 포기
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      keepalive-time: 60000
      max-lifetime: 300000
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${PORT:8080}
  # Codespaces / Render 는 프록시 뒤에서 돌기 때문에, 리다이렉트를 "/admin/login" 같은 상대 주소로 보냅니다
  # (절대 주소면 http://localhost:8080/... 로 나가서 브라우저가 엉뚱한 곳으로 감)
  forward-headers-strategy: native
  tomcat:
    use-relative-redirects: true
  servlet:
    session:
      timeout: 60m          # 관리자 로그인 유지 시간
      tracking-modes: cookie  # 주소창에 ;jsessionid=... 가 붙지 않게
      cookie:
        http-only: true
        same-site: lax      # 다른 사이트에서 관리자 요청을 대신 보내지 못하게

# 관리자 페이지(/admin) 로그인 정보. ADMIN_PASSWORD 가 비어 있으면 관리자 페이지는 잠겨 있습니다.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

# 외부 시세 API 설정. 키는 모두 .env 에서 읽고, 비어 있으면 해당 기능만 "키 없음" 안내를 보여줍니다.
invest:
  data-go-kr:
    # 공공데이터포털 일반 인증키 (Decoding 키 권장. Encoding 키를 넣어도 자동 처리)
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    gold-url: ${DATA_GO_KR_GOLD_URL:https://apis.data.go.kr/1160100/GetGeneralProductInfoService_V2/getGoldPriceInfo_V2}
    apt-trade-url: ${DATA_GO_KR_APT_TRADE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade}
  koreaexim:
    auth-key: ${KOREAEXIM_AUTH_KEY:}
    url: ${KOREAEXIM_URL:https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON}
  kis:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    # 계좌번호 10자리 (예: 50012345-01)
    account-no: ${KIS_ACCOUNT_NO:}
    # true = 모의투자, false = 실전투자
    mock: ${KIS_MOCK:true}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    # 접근토큰은 발급 횟수 제한이 있어서 파일에 저장해 두고 재사용합니다 (.gitignore 등록됨)
    token-cache-file: ${KIS_TOKEN_CACHE_FILE:.kis-token.json}
