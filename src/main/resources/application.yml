spring:
  # 로컬에서는 프로젝트 루트의 .env 파일에서 DB 접속 정보를 읽습니다 (Git에 올라가지 않음).
  # Render 같은 배포 환경에서는 대시보드의 Environment 변수로 같은 이름의 값을 넣으면 됩니다.
  config:
    import: optional:file:.env[.properties]

  # TiDB Cloud Serverless (MySQL 호환)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${PORT:8080}
