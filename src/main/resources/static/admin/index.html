<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Invest 관리자</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <a class="brand" href="/admin/">
      <span class="brand-mark">◆</span>
      <h1>My Invest <span class="badge">관리자</span></h1>
    </a>
    <div class="actions">
      <label class="theme-toggle" id="theme-toggle" title="다크/라이트 모드 전환">
        <span class="theme-toggle-icon" id="theme-icon">☀️</span>
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span id="theme-label">라이트</span>
      </label>
      <a class="btn ghost icon" href="/">사용자 화면으로 →</a>
      <form method="post" action="/admin/logout"><button class="btn ghost icon" type="submit">로그아웃</button></form>
    </div>
  </header>

  <div id="msg"></div>

  <!-- 개요 -->
  <div class="panel-head"><h2>개요</h2><button class="btn ghost icon" id="reload">새로고침</button></div>
  <div class="cards" id="overview">
    <div class="card"><div class="label">회원</div><div class="value"><span class="skel sm"></span></div></div>
    <div class="card"><div class="label">모의투자 계좌</div><div class="value"><span class="skel sm"></span></div></div>
    <div class="card"><div class="label">보유 자산</div><div class="value"><span class="skel sm"></span></div></div>
    <div class="card"><div class="label">관심종목</div><div class="value"><span class="skel sm"></span></div></div>
  </div>
  <div class="key-status" id="keys"></div>

  <!-- 회원 관리 -->
  <div class="panel-head sub">
    <h3>회원 관리</h3>
    <div class="actions">
      <select id="member-stat-filter">
        <option value="">전체</option>
        <option value="NORMAL">정상</option>
        <option value="LOCKED">잠금</option>
        <option value="DORMANT">휴면</option>
        <option value="WITHDRAWN">탈퇴</option>
      </select>
      <button class="btn ghost icon" id="member-reload">새로고침</button>
    </div>
  </div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th>번호</th><th>아이디</th><th>이름</th><th>상태</th>
        <th class="num">로그인실패</th><th>최종로그인</th><th>가입일</th><th></th>
      </tr></thead>
      <tbody id="member-rows"></tbody>
    </table>
  </div>

  <!-- 모의투자 계좌 -->
  <div class="panel-head sub">
    <h3>모의투자 계좌</h3>
    <button class="btn ghost icon" id="account-reload">새로고침</button>
  </div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th>계좌번호</th><th>회원</th><th>계좌명</th>
        <th class="num">예수금</th><th class="num">초기금액</th><th class="num">손익</th>
        <th>상태</th><th>개설일</th>
      </tr></thead>
      <tbody id="invest-account-rows"></tbody>
    </table>
  </div>

  <!-- 보유 자산 -->
  <div class="panel-head sub"><h3>보유 자산 <span class="muted small">(DB 원본, 시세 미포함)</span></h3></div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th>ID</th><th>종류</th><th>이름</th><th class="num">수량</th><th class="num">평균 매입가</th>
        <th class="num">직접 입력 현재가</th><th>메모</th><th>수정일</th><th></th>
      </tr></thead>
      <tbody id="holdings"></tbody>
    </table>
  </div>

  <!-- 관심종목 -->
  <div class="panel-head sub"><h3>관심종목</h3></div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr><th>종목코드</th><th>이름</th><th>등록일</th><th></th></tr></thead>
      <tbody id="watchlist"></tbody>
    </table>
  </div>

</div>
<script src="/admin/admin.js"></script>
</body>
</html>
