<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1); width: 360px; }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem; color: #111; }
        label { display: block; font-size: .85rem; font-weight: 600; color: #444; margin-bottom: .3rem; }
        input { width: 100%; padding: .65rem .9rem; border: 1px solid #ddd; border-radius: 8px; font-size: .95rem; margin-bottom: 1rem; }
        input:focus { outline: none; border-color: #4f8ef7; }
        button { width: 100%; padding: .75rem; background: #4f8ef7; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #3a7be0; }
        .error { background: #fff0f0; color: #d9534f; padding: .6rem .9rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; }
        .back { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: #888; text-decoration: none; }
        .back:hover { color: #4f8ef7; }
    </style>
</head>
<body>
<div class="card">
    <h1>모의투자 로그인</h1>

    <div class="error" th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div class="error" th:if="${param.logout}" style="background:#f0fff4;color:#2d6a4f;">
        로그아웃 되었습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="로그인 아이디" autocomplete="username" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>

        <button type="submit">로그인</button>
    </form>

    <a href="/" class="back">← 메인으로</a>
</div>
</body>
</html>
